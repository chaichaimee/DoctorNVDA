name = DoctorNVDA
summary = "DoctorNVDA"
description = """DoctorNVDA is a diagnostic and recovery utility for NVDA. It recovers frozen speech, analyzes crash logs, isolates faulty add-ons, backs up and restores settings, exports system info, and cleans temporary cache files to maintain screen reader stability.
Hot Keys:
ALT+Windows+D
Single Tap : open DoctorNVDA menu
Double Tap : Restart NVDA
Tripple Tap : Restart NVDA with add-ons disabled
ALT+Windows+R
Single : Emergency Synthesizer Reboot, force-reinitialize the speech synthesizer and audio output
Double : Crash Log Analyzer  collapsed"""
author = "Chai Chaimee <chaicm75@gmail.com>"
url = https://github.com/chaichaimee/DoctorNVDA
version = 2026.9.0
changelog = """The Binary Search Debugging add-on's list of add-ons is updated in each round. New features launched: Emergency Synthesizer Reboot and Crash Log Analyzer."""
