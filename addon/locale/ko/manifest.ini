summary = "DoctorNVDA"
description = """DoctorNVDA는 NVDA용 진단 및 복구 유틸리티입니다. 멈춘 음성을 복구하고, 충돌 로그를 분석하며, 결함이 있는 추가 기능을 격리하고, 설정을 백업 및 복원하며, 시스템 정보를 내보내고, 임시 캐시 파일을 정리하여 스크린 리더의 안정성을 유지합니다.
단축키:
ALT+Windows+D
한 번 누름 : DoctorNVDA 메뉴 열기
두 번 누름 : NVDA 다시 시작
세 번 누름 : 추가 기능을 비활성화한 상태로 NVDA 다시 시작
ALT+Windows+R
한 번 누름 : 응급 음성 합성기 재부팅, 음성 합성기 및 오디오 출력을 강제로 다시 초기화
두 번 누름 : 충돌 로그 분석기 접힘"""