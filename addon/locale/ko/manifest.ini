summary = "닥터 NVDA"
description = """DoctorNVDA는 NVDA를 위한 진단 및 복구 유틸리티입니다. 화면 읽기 프로그램의 안정성을 유지하기 위해 멈춘 음성을 복구하고, 충돌 로그를 분석하며, 문제가 있는 애드온을 격리하고, 설정을 백업 및 복원하며, 시스템 정보를 내보내고, 임시 캐시 파일을 정리합니다.
단축키:
ALT+Windows+D
한 번 탭: DoctorNVDA 메뉴 열기
두 번 탭: NVDA 재시작
세 번 탭: 애드온을 비활성화하고 NVDA 재시작
ALT+Windows+R
한 번: 긴급 음성 합성기 재부팅, 음성 합성기 및 오디오 출력 강제 재초기화
두 번: 충돌 로그 분석기 접힘"""