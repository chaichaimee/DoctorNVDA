summary = "DoctorNVDA"
description = """DoctorNVDA เป็นเครื่องมือวินิจฉัยและกู้คืนสำหรับ NVDA ช่วยกู้คืนเสียงสังเคราะห์ที่ค้าง วิเคราะห์บันทึกข้อผิดพลาด (crash log) คัดแยกแอดออนที่มีปัญหา สำรองและคืนค่าการตั้งค่า ส่งออกข้อมูลระบบ และล้างไฟล์แคชชั่วคราวเพื่อรักษาสเถียรภาพของโปรแกรมอ่านจอภาพ
ปุ่มลัด:
ALT+Windows+D
กดหนึ่งครั้ง : เปิดเมนู DoctorNVDA
กดสองครั้ง : เริ่มทำงาน NVDA ใหม่
กดสามครั้ง : เริ่มทำงาน NVDA ใหม่โดยปิดการใช้งานแอดออน
ALT+Windows+R
กดหนึ่งครั้ง : รีบูตโปรแกรมสังเคราะห์เสียงแบบฉุกเฉิน บังคับเริ่มการทำงานของโปรแกรมสังเคราะห์เสียงและอุปกรณ์ส่งออกเสียงใหม่
กดสองครั้ง : ตัววิเคราะห์บันทึกข้อผิดพลาด ย่ออยู่"""