summary = "DoctorNVDA"
description = """DoctorNVDA เป็นยูทิลิตี้วินิจฉัยและกู้คืนสำหรับ NVDA ช่วยกู้คืนเสียงพูดที่ค้าง วิเคราะห์บันทึกข้อผิดพลาด แยกแยะส่วนเสริมที่ทำงานผิดปกติ สำรองและกู้คืนการตั้งค่า ส่งออกข้อมูลระบบ และล้างไฟล์แคชชั่วคราวเพื่อรักษาเสถียรภาพของโปรแกรมอ่านหน้าจอ
ปุ่มลัด:
ALT+Windows+D
แตะครั้งเดียว: เปิดเมนู DoctorNVDA
แตะสองครั้ง: รีสตาร์ท NVDA
แตะสามครั้ง: รีสตาร์ท NVDA โดยปิดการใช้งานส่วนเสริมทั้งหมด
ALT+Windows+R
กดครั้งเดียว: รีบูตเครื่องสังเคราะห์เสียงฉุกเฉิน บังคับเริ่มต้นการทำงานของเครื่องสังเคราะห์เสียงและเอาต์พุตเสียงใหม่
กดสองครั้ง: ตัววิเคราะห์บันทึกข้อผิดพลาด ย่อแล้ว"""