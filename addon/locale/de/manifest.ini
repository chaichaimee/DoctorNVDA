summary = "DoctorNVDA"
description = """DoctorNVDA ist ein Diagnose- und Wiederherstellungs-Werkzeug für NVDA. Es stellt eingefrorene Sprachausgaben wieder her, analysiert Absturzprotokolle, isoliert fehlerhafte Erweiterungen, sichert und stellt Einstellungen wieder her, exportiert Systeminformationen und bereinigt temporäre Cache-Dateien, um die Stabilität des Screenreaders aufrechtzuerhalten.
Tastenkombinationen:
ALT+Windows+D
Einmal drücken : DoctorNVDA-Menü öffnen
Zweimal drücken : NVDA neu starten
Dreimal drücken : NVDA mit deaktivierten Erweiterungen neu starten
ALT+Windows+R
Einmal drücken : Notfall-Neustart der Sprachausgabe, erzwingt die Neuinitialisierung der Sprachausgabe und der Audioausgabe
Zweimal drücken : Absturzprotokoll-Analyse eingenommen"""