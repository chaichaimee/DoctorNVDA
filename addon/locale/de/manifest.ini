summary = "DoctorNVDA"
description = """DoctorNVDA ist ein Diagnose- und Wiederherstellungswerkzeug für NVDA. Es stellt hängengebliebene Sprachausgabe wieder her, analysiert Absturzprotokolle, isoliert fehlerhafte Add-ons, sichert und stellt Einstellungen wieder her, exportiert Systeminformationen und bereinigt temporäre Cache-Dateien, um die Stabilität des Screenreaders zu gewährleisten.
Tastenkombinationen:
ALT+Windows+D
Einfach tippen: DoctorNVDA-Menü öffnen
Doppelt tippen: NVDA neu starten
Dreifach tippen: NVDA ohne Add-ons neu starten
ALT+Windows+R
Einfach: Notfall-Synthesizer-Neustart, Sprachausgabe und Tonausgabe zwangsweise neu initialisieren
Doppelt: Absturzprotokoll-Analyse  eingeklappt"""