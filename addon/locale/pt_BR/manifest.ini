summary = "DoctorNVDA"
description = """DoctorNVDA é um utilitário de diagnóstico e recuperação para o NVDA. Ele recupera a fala travada, analisa logs de falhas, isola complementos problemáticos, faz backup e restauração de configurações, exporta informações do sistema e limpa arquivos de cache temporários para manter a estabilidade do leitor de tela.
Teclas de Atalho:
ALT+Windows+D
Toque Único: abrir o menu do DoctorNVDA
Toque Duplo: Reiniciar o NVDA
Toque Triplo: Reiniciar o NVDA com os complementos desativados
ALT+Windows+R
Único: Reinicialização de Emergência do Sintetizador, força a reinicialização do sintetizador de voz e da saída de áudio
Duplo: Analisador de Log de Falhas recolhido"""