summary = "DoctorNVDA"
description = """DoctorNVDA é um utilitário de diagnóstico e recuperação para o NVDA. Ele recupera a fala travada, analisa logs de falhas, isola complementos com defeito, faz backup e restaura configurações, exporta informações do sistema e limpa arquivos temporários de cache para manter a estabilidade do leitor de tela.
Teclas de atalho:
ALT+Windows+D
Toque único : abrir o menu do DoctorNVDA
Toque duplo : reiniciar o NVDA
Toque triplo : reiniciar o NVDA com os complementos desativados
ALT+Windows+R
Toque único : reinicialização de emergência do sintetizador, força a reinicialização do sintetizador de voz e da saída de áudio
Toque duplo : analisador de log de falhas recolhido"""