summary = "DoctorNVDA"
description = """DoctorNVDA, NVDA के लिए एक नैदानिक (diagnostic) और पुनर्प्राप्ति (recovery) उपयोगिता है। यह रुकी हुई वाक् (speech) को पुनर्स्थापित करता है, क्रैश लॉग का विश्लेषण करता है, दोषपूर्ण ऐड-ऑन्स को अलग करता है, सेटिंग्स का बैकअप और पुनर्प्राप्ति करता है, सिस्टम जानकारी निर्यात करता है, और स्क्रीन रीडर की स्थिरता बनाए रखने के लिए अस्थायी कैश फ़ाइलों को साफ़ करता है।
हॉट-कीज़:
ALT+Windows+D
एक बार दबाएं : DoctorNVDA मेनू खोलें
दो बार दबाएं : NVDA को पुनरारंभ करें
तीन बार दबाएं : ऐड-ऑन्स को अक्षम करके NVDA को पुनरारंभ करें
ALT+Windows+R
एक बार दबाएं : आपातकालीन सिंथेसाइज़र रीबूट, स्पीच सिंथेसाइज़र और ऑडियो आउटपुट को बलपूर्वक पुनः प्रारंभ करें
दो बार दबाएं : क्रैश लॉग विश्लेषक सिमटा हुआ"""