summary = "डॉक्टरएनवीडीए (DoctorNVDA)"
description = """डॉक्टरएनवीडीए (DoctorNVDA) एनवीडीए (NVDA) के लिए एक डायग्नोस्टिक और रिकवरी यूटिलिटी है। यह अटकी हुई स्पीच को ठीक करता है, क्रैश लॉग का विश्लेषण करता है, खराब ऐड-ऑन को अलग करता है, सेटिंग्स का बैकअप लेता और पुनर्स्थापित करता है, सिस्टम की जानकारी निर्यात करता है, और स्क्रीन रीडर की स्थिरता बनाए रखने के लिए अस्थायी कैश फ़ाइलों को साफ़ करता है।
हॉटकीज़:
ALT+Windows+D
सिंगल टैप: डॉक्टरएनवीडीए (DoctorNVDA) मेनू खोलें
डबल टैप: एनवीडीए (NVDA) रीस्टार्ट करें
ट्रिपल टैप: ऐड-ऑन अक्षम करके एनवीडीए (NVDA) रीस्टार्ट करें
ALT+Windows+R
सिंगल: इमरजेंसी सिंथेसाइज़र रीबूट, स्पीच सिंथेसाइज़र और ऑडियो आउटपुट को जबरन री-इनिशियलाइज करें
डबल: क्रैश लॉग विश्लेषक संपड़ित है"""