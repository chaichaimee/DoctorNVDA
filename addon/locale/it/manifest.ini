summary = "DoctorNVDA"
description = """DoctorNVDA bir NVDA tanılama ve kurtarma aracıdır. Donan sesleri kurtarır, köklenme günlüklerini analiz eder, hatalı eklentileri yalıtır, ayarları yedekler ve geri yükler, sistem bilgilerini dışarı aktarır ve ekran okuyucu kararlılığını korumak için geçici önbellek dosyalarını temizler.
Kısayol Tuşları:
ALT+Windows+D
Tek Dokunuş : DoctorNVDA menüsünü açar
Çift Dokunuş : NVDA'yı yeniden başlatır
Üçlü Dokunuş : NVDA'yı eklentiler devre dışı bırakılmış olarak yeniden başlatır
ALT+Windows+R
Tek : Acil Sentezleyici Yeniden Başlatma, ses sentezleyicisini ve ses çıkışını zorla yeniden başlatır
Çift : Çökme Günlüğü Analizcisi daraltılmış"""