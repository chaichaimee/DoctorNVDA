summary = "DoctorNVDA"
description = """DoctorNVDA è un'utility di diagnosi e ripristino per NVDA. Ripristina la sintesi vocale bloccata, analizza i log di crash, isola i componenti aggiuntivi difettosi, esegue il backup e il ripristino delle impostazioni, esporta le informazioni di sistema e pulisce i file di cache temporanei per mantenere la stabilità del screen reader.
Tasti caldi:
ALT+Windows+D
Pressione singola : apre il menu di DoctorNVDA
Doppia pressione : riavvia NVDA
Tripla pressione : riavvia NVDA con i componenti aggiuntivi disabilitati
ALT+Windows+R
Pressione singola : riavvio d'emergenza del sintetizzatore, forza il reinizio del sintetizzatore vocale e dell'uscita audio
Doppia pressione : analizzatore dei log di crash compresso"""