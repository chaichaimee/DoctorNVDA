summary = "DoctorNVDA"
description = """DoctorNVDA adalah utilitas diagnosis dan pemulihan untuk NVDA. Utilitas ini memulihkan suara yang macet, menganalisis log kerusakan, mengisolasi pengaya yang bermasalah, mencadangkan dan memulihkan pengaturan, mengekspor informasi sistem, serta membersihkan berkas tembolok sementara untuk menjaga stabilitas pembaca layar.
Tombol Pintas:
ALT+Windows+D
Tekan Sekali : membuka menu DoctorNVDA
Tekan Dua Kali : Memulai Ulang NVDA
Tekan Tiga Kali : Memulai Ulang NVDA dengan pengaya dinonaktifkan
ALT+Windows+R
Tekan Sekali : Muat Ulang Penyuara Darurat, memaksa inisialisasi ulang penyuara bicara dan output audio
Tekan Dua Kali : Penganalisis Log Kerusakan diciutkan"""