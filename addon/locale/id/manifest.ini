summary = "DoctorNVDA"
description = """DoctorNVDA adalah utilitas diagnostik dan pemulihan untuk NVDA. Utilitas ini memulihkan suara yang macet, menganalisis log kagalakan, mengisolasi add-on yang rusak, mencadangkan dan memulihkan pengaturan, mengekspor informasi sistem, dan membersihkan berkas tembolok sementara untuk menjaga kestabilan pembaca layar.
Tombol Pintas:
ALT+Windows+D
Ketukan Tunggal : buka menu DoctorNVDA
Ketukan Ganda : Mulai ulang NVDA
Ketukan Tiga Kali : Mulai ulang NVDA dengan add-on dinonaktifkan
ALT+Windows+R
Tunggal : Mulai ulang Sintetis Darurat, paksa inisialisasi ulang sintetis suara dan output audio
Ganda : Penganalisis Log Kagalakan  ciut"""