summary = "DoctorNVDA"
description = """DoctorNVDA es una utilidad de diagnóstico y recuperación para NVDA. Recupera la voz congelada, analiza registros de fallos, aísla complementos defectuosos, respalda y restaura configuraciones, exporta información del sistema y limpia archivos temporales de caché para mantener la estabilidad del lector de pantalla.
Teclas rápidas:
ALT+Windows+D
Un toque: abrir el menú de DoctorNVDA
Doble toque: reiniciar NVDA
Triple toque: reiniciar NVDA con los complementos desactivados
ALT+Windows+R
Un toque: reinicio de emergencia del sintetizador, fuerza la reinicialización del sintetizador de voz y la salida de audio
Doble toque: analizador de registros de fallos contraído"""