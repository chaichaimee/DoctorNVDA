summary = "DoctorNVDA"
description = """DoctorNVDA es una herramienta de diagnóstico y recuperación para NVDA. Recupera la voz congelada, analiza registros de fallos, aisla complementos defectuosos, realiza copias de seguridad y restaura configuraciones, exporta información del sistema y limpia archivos de caché temporales para mantener la estabilidad del lector de pantalla.
Teclas rápidas:
ALT+Windows+D
Un toque : abrir el menú de DoctorNVDA
Doble toque : reiniciar NVDA
Triple toque : reiniciar NVDA con los complementos deshabilitados
ALT+Windows+R
Un toque : reinicio de emergencia del sintetizador, fuerza el reinicio del sintetizador de voz y la salida de audio
Doble toque : analizador de registros de fallos contraído"""