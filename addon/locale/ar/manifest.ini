summary = "DoctorNVDA"
description = """DoctorNVDA هي أداة تشخيص واستعادة لنظام NVDA. تقوم باستعادة النطق المتوقف، وتحليل سجلات الأعطال، وعزل الإضافات المعطلة، والنسخ الاحتياطي للإعدادات واستعادتها، وتصدير معلومات النظام، وتنظيف ملفات التخزين المؤقت للحفاظ على استقرار قارئ الشاشة.
مفاتيح الاختصار:
ALT+Windows+D
نقرة واحدة: فتح قائمة DoctorNVDA
نقرة مزدوجة: إعادة تشغيل NVDA
نقرة ثلاثية: إعادة تشغيل NVDA مع تعطيل الإضافات
ALT+Windows+R
نقرة واحدة: إعادة تشغيل طارئة للمركب الصوتي، فرض إعادة تهيئة مركب النطق وإخراج الصوت
نقرة مزدوجة: محلل سجل الأعطال مطوي"""