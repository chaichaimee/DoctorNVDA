summary = "DoctorNVDA"
description = """DoctorNVDA هي أداة مساعدة للتشخيص والاسترداد لبرنامج NVDA. تقوم باستعادة النطق المتجمد، وتحليل سجلات الانهيار، وعزل الإضافات البرمجية المعطوبة، وأخذ نسخ احتياطية واستعادتها للإعدادات، وتصدير معلومات النظام، وتنظيف ملفات التخزين المؤقت المؤقتة للحفاظ على استقرار قارئ الشاشة.
مفاتيح الاختصار:
ALT+Windows+D
ضغطة واحدة : فتح قائمة DoctorNVDA
ضغطتان : إعادة تشغيل NVDA
3 ضغطات : إعادة تشغيل NVDA مع تعطيل الإضافات البرمجية
ALT+Windows+R
ضغطة واحدة : إعادة تشغيل آلة النطق في حالات الطوارئ، وإعادة تهيئة آلة النطق ومخرج الصوت قسراً
ضغطتان : أداة تحليل سجل الانهيار مطوية"""