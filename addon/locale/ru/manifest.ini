summary = "Доктор NVDA"
description = """Доктор NVDA — это утилита диагностики и восстановления для NVDA. Она восстанавливает зависшую речь, анализирует журналы сбоев, изолирует проблемные доп. компоненты, создает резервные копии и восстанавливает настройки, экспортирует системную информацию и очищает временные файлы кэша для поддержания стабильности программы чтения с экрана.
Горячие клавиши:
ALT+Windows+D
Одиночное касание: открыть меню Доктора NVDA
Двойное касание: перезапустить NVDA
Тройное касание: перезапустить NVDA с отключенными доп. компонентами
ALT+Windows+R
Одиночное: экстренный перезапуск синтезатора речи, принудительная реинициализация синтезатора речи и аудиовыхода
Двойное: анализатор журналов сбоев свернуто"""