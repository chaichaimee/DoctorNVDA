summary = "DoctorNVDA"
description = """DoctorNVDA は NVDA 用の診断および復旧ユーティリティです。フリーズした音声の復旧、クラッシュログの解析、不具合のあるアドオンの分離、設定のバックアップと復元、システム情報の出力、一時キャッシュファイルの削除を行い、スクリーンリーダーの安定性を維持します。
ショートカットキー:
ALT+Windows+D
1回押す : DoctorNVDA メニューを開く
2回押す : NVDA を再起動する
3回押す : アドオンを無効にして NVDA を再起動する
ALT+Windows+R
1回押す : 音声合成エンジンの緊急再起動（音声合成エンジンと音声出力を強制再初期化）
2回押す : クラッシュログ解析ツール（折りたたみ）"""