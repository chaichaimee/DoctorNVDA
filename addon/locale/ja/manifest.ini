summary = "DoctorNVDA"
description = """DoctorNVDAは、NVDAの診断および復旧ユーティリティです。音声のフリーズからの復旧、クラッシュログの分析、問題のあるアドオンの特定、設定のバックアップと復元、システム情報の書き出し、一時キャッシュファイルのクリーンアップを行い、スクリーンリーダーの安定性を維持します。
ホットキー:
ALT+Windows+D
シングルタップ : DoctorNVDAメニューを開く
ダブルタップ : NVDAを再起動
トリプルタップ : アドオンを無効にしてNVDAを再起動
ALT+Windows+R
シングル : 緊急音声エンジン再起動（音声合成エンジンとオーディオ出力を強制的に再初期化します）
ダブル : クラッシュログアナライザー 折りたたみ中"""