summary = "DoctorNVDA"
description = """DoctorNVDA est un utilitaire de diagnostic et de récupération pour NVDA. Il restaure la parole bloquée, analyse les journaux de plantage, isole les extensions défaillantes, sauvegarde et restaure les paramètres, exporte les informations système et nettoie les fichiers caches temporaires pour maintenir la stabilité du lecteur d'écran.
Raccourcis clavier :
ALT+Windows+D
Pression simple : ouvrir le menu DoctorNVDA
Double pression : redémarrer NVDA
Triple pression : redémarrer NVDA avec les extensions désactivées
ALT+Windows+R
Pression simple : redémarrage d'urgence du synthétiseur, force la réinitialisation du synthétiseur vocal et de la sortie audio
Double pression : analyseur de journal de plantage réduit"""