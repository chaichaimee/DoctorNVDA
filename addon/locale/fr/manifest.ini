summary = "DoctorNVDA"
description = """DoctorNVDA est un utilitaire de diagnostic et de récupération pour NVDA. Il rétablit la parole bloquée, analyse les journaux de plantage, isole les extensions défectueuses, sauvegarde et restaure les paramètres, exporte les informations système et nettoie les fichiers de cache temporaires pour maintenir la stabilité du lecteur d'écran.
Raccourcis clavier :
ALT+Windows+D
Appui simple : ouvrir le menu de DoctorNVDA
Appui double : Redémarrer NVDA
Appui triple : Redémarrer NVDA sans les extensions
ALT+Windows+R
Simple : Redémarrage d'urgence du synthétiseur, force la réinitialisation du synthétiseur vocal et de la sortie audio
Double : Analyseur de journal de plantage replié"""