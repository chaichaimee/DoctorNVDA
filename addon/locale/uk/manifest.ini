summary = "Доктор NVDA"
description = """Доктор NVDA — це діагностично-відновлювальна утиліта для NVDA. Вона відновлює завислу мову, аналізує журнали збоїв, ізолює несправні доповнення, створює резервні копії та відновлює налаштування, експортує системну інформацію та очищує тимчасові файли кешу для підтримки стабільності програми читання з екрана.
Гарячі клавіші:
ALT+Windows+D
Одне натискання: відкрити меню Доктор NVDA
Подвійне натискання: перезапустити NVDA
Потрійне натискання: перезапустити NVDA з вимкненими доповненнями
ALT+Windows+R
Одне: екстрене перезавантаження синтезатора, примусова повторна ініціалізація синтезатора мовлення та аудіовиходу
Подвійне: аналізатор журналів збоїв згорнуто"""