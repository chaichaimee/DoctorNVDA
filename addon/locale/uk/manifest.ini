summary = "DoctorNVDA"
description = """DoctorNVDA — це утиліта для діагностики та відновлення NVDA. Вона відновлює завислу мову, аналізує журнали збоїв, ізолює несправні додатки, створює резервні копії та відновлює налаштування, експортує системну інформацію та очищує тимчасові файли кешу для підтримки стабільності екранного читача.
Гарячі клавіші:
ALT+Windows+D
Одинарне натискання : відкрити меню DoctorNVDA
Подвійне натискання : перезапустити NVDA
Потрійне натискання : перезапустити NVDA з вимкненими додатками
ALT+Windows+R
Одинарне натискання : аварійне перезавантаження синтезатора, примусова повторна ініціалізація синтезатора мовлення та аудіовиходу
Подвійне натискання : аналізатор журналу збоїв згорнуто"""